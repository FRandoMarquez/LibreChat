# Default values for librechat.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1



global:
   # default Secret for envs/ only Passwords. Can be locally generated with: kubectl create secret generic librechat-secret-envs --from-env-file=.env.example --dry-run=client -o yaml > secret-envs.yaml
   # For better maintainabillity, you can put all vars directly in the config Section and only overwrite Secrets with this if nessesary.
   # Required Values:
   # - CREDS_KEY
   # - CREDS_IV
   # - JWT_SECRET
   # - JWT_REFRESH_SECRET
   # - MEILI_MASTER_KEY
  librechat:
    existingSecretName: "librechat-credentials-env"
    # Used for Setting the Right Key, can be something like AZURE_API_KEY, if Azure OpenAI is used
    existingSecretApiKey: STACKIT_API_KEY
    # Optionally add extra globally accessible environment variables here. These can be referenced under ConfigEnv to make them accessible inside LibreChat
    # env:
    #  - name: API_KEY
    #    valueFrom:
    #      secretKeyRef:
    #        name: api_access
    #        key: api_key
    #  - name: CLIENT_ID
    #    valueFrom:
    #      secretKeyRef:
    #        name: credentials
    #        key: client_id

librechat:
  configEnv:
    # IMPORTANT -- GENERATE your own: openssl rand -hex 32 and openssl rand -hex 16 for CREDS_IV. Best Practise: Put into Secret. See global.librechat.existingSecretName
    # Set Config Params here
    # ENV_NAME: env-value
    NO_INDEX: "true"
    TRUST_PROXY: "1"
    DEBUG_LOGGING: "true"
    CONSOLE_JSON: "true"
    ENDPOINTS: "custom"
    STACKIT_BASE_URL: "https://api.openai-compat.model-serving.eu01.onstackit.cloud/v1"
    SEARCH: "true"
    MEILI_NO_ANALYTICS: "true"
    MEILI_HOST: "http://meilisearch:7700"
    ALLOW_EMAIL_LOGIN: "true"
    ALLOW_REGISTRATION: "true"
    RAG_PORT: "8000"
    RAG_API_URL: "http://host.docker.internal:8000"
    EMBEDDINGS_PROVIDER: "huggingface"
    EMBEDDINGS_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
    COLLECTION_NAME: "librechat_docs"
    CHUNK_SIZE: "1500"
    CHUNK_OVERLAP: "100"
    RAG_USE_FULL_CONTEXT: "false"
    # existing Secret for all envs/ only Passwords. Can be locally generated with: kubectl create secret generic librechat-secret-envs --from-env-file=.env.example --dry-run=client -o yaml > secret-envs.yaml
    # For better maintainabillity, you can put all vars directly in the config Section and only overwrite Secrets with this if nessesary.
    # Required Values:
    # - MEILI_MASTER_KEY
  existingSecretName: "librechat-credentials-env"
  
  # For adding a custom config yaml-file you can set the contents in this var. See https://www.librechat.ai/docs/configuration/librechat_yaml/example
  # configYamlContent: ""
  configYamlContent: |
    # LibreChat Configuration for StackIt Integration

    version: 1.1.7

    cache: true

    # UI Configuration
    interface:
      privacyPolicy:
        externalUrl: 'https://librechat.ai/privacy-policy'
        openNewTab: true
      # Terms of service
      termsOfService:
        externalUrl: 'https://librechat.ai/tos'
        openNewTab: true
        modalAcceptance: true
        modalTitle: 'Terms of Service for LibreChat'
        modalContent: |
          # Terms and Conditions for LibreChat

          *Effective Date: February 18, 2024*

          Welcome to LibreChat, the informational website for the open-source AI chat platform, available at https://librechat.ai. These Terms of Service ("Terms") govern your use of our website and the services we offer. By accessing or using the Website, you agree to be bound by these Terms and our Privacy Policy, accessible at https://librechat.ai//privacy.

          ## 1. Ownership

          Upon purchasing a package from LibreChat, you are granted the right to download and use the code for accessing an admin panel for LibreChat. While you own the downloaded code, you are expressly prohibited from reselling, redistributing, or otherwise transferring the code to third parties without explicit permission from LibreChat.

          ## 2. User Data

          We collect personal data, such as your name, email address, and payment information, as described in our Privacy Policy. This information is collected to provide and improve our services, process transactions, and communicate with you.

          ## 3. Non-Personal Data Collection

          The Website uses cookies to enhance user experience, analyze site usage, and facilitate certain functionalities. By using the Website, you consent to the use of cookies in accordance with our Privacy Policy.

          ## 4. Use of the Website

          You agree to use the Website only for lawful purposes and in a manner that does not infringe the rights of, restrict, or inhibit anyone else's use and enjoyment of the Website. Prohibited behavior includes harassing or causing distress or inconvenience to any person, transmitting obscene or offensive content, or disrupting the normal flow of dialogue within the Website.

          ## 5. Governing Law

          These Terms shall be governed by and construed in accordance with the laws of the United States, without giving effect to any principles of conflicts of law.

          ## 6. Changes to the Terms

          We reserve the right to modify these Terms at any time. We will notify users of any changes by email. Your continued use of the Website after such changes have been notified will constitute your consent to such changes.

          ## 7. Contact Information

          If you have any questions about these Terms, please contact us at contact@librechat.ai.

          By using the Website, you acknowledge that you have read these Terms of Service and agree to be bound by them.

    # Custom endpoints for StackIt
    endpoints:
      custom:
        # StackIt LLM Endpoint
        - name: "StackIt"
          apiKey: "${STACKIT_API_KEY}"
          baseURL: "${STACKIT_BASE_URL}"
          models:
            default: [
              "neuralmagic/Meta-Llama-3.1-8B-Instruct-FP8",
              "cortecs/Llama-3.3-70B-Instruct-FP8-Dynamic",
              "neuralmagic/Mistral-Nemo-Instruct-2407-FP8",
              "google/gemma-3-27b-it",
              "openai/gpt-oss-120b"
            ]
            fetch: false
          titleConvo: true
          titleModel: "neuralmagic/Meta-Llama-3.1-8B-Instruct-FP8"
          modelDisplayLabel: "StackIt Models"
          # Request/response transformer for StackIt compatibility
          headers:
            "Content-Type": "application/json"
            "Authorization": "Bearer ${STACKIT_API_KEY}"

    # Registration and authentication settings  
    registration:
      socialLogins: ["discord", "facebook", "github", "google", "openid"]

    # File configuration for uploads
    fileConfig:
      endpoints:
        assistants:
          fileLimit: 5
          fileSizeLimit: 10  # Maximum size in MB
          totalSizeLimit: 50
          supportedMimeTypes:
            - "image/.*"
            - "application/pdf"
        openAI:
          disabled: false
        default:
          totalSizeLimit: 20

    # Model specifications for StackIt models
    modelSpecs:
      enforce: false
      list:
        - name: "neuralmagic/Meta-Llama-3.1-8B-Instruct-FP8"
          label: "Llama 3.1 8B Instruct (FP8)"
          preset:
            model: "neuralmagic/Meta-Llama-3.1-8B-Instruct-FP8"
            endpoint: "StackIt"
          maxContext: 128000
          inputCost: 0.0003
          outputCost: 0.0006
        - name: "cortecs/Llama-3.3-70B-Instruct-FP8-Dynamic"
          label: "Llama 3.3 70B Instruct (FP8)"
          preset:
            model: "cortecs/Llama-3.3-70B-Instruct-FP8-Dynamic"
            endpoint: "StackIt"
          maxContext: 128000
          inputCost: 0.002
          outputCost: 0.004
        - name: "neuralmagic/Mistral-Nemo-Instruct-2407-FP8"
          label: "Mistral Nemo Instruct (FP8)"
          preset:
            model: "neuralmagic/Mistral-Nemo-Instruct-2407-FP8"
            endpoint: "StackIt"
          maxContext: 128000
          inputCost: 0.0002
          outputCost: 0.0004
        - name: "google/gemma-3-27b-it"
          label: "Gemma 3 27B Instruct"
          preset:
            model: "google/gemma-3-27b-it"
            endpoint: "StackIt"
          maxContext: 37000
          inputCost: 0.001
          outputCost: 0.002
        - name: "openai/gpt-oss-120b"
          label: "GPT-OSS 120B"
          preset:
            model: "openai/gpt-oss-120b"
            endpoint: "StackIt"
          maxContext: 131000
          inputCost: 0.003
          outputCost: 0.006 

  # name of existing Yaml configmap, key must be librechat.yaml
  existingConfigYaml: ""

  # Volume used to store image Files uploaded to the Web UI
  imageVolume:
    enabled: true
    size: 10G
    accessModes: ReadWriteOnce
    # storageClassName: 

# only lite RAG is supported
librechat-rag-api:
  enabled: false
  # can be azure, openai, huggingface or huggingfacetei
  embeddingsProvider: huggingface


image:
  repository: danny-avila/librechat
  registry: ghcr.io
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

lifecycle: {}
# # base for adding a custom banner // see https://github.com/danny-avila/LibreChat/pull/3952 for an example
#   postStart:
#     exec:
#       command: ["/bin/sh", "-c", "npm run update-banner <displayFrom(Format: yyyy-mm-ddTHH:MM:SSZ)> <displayTo(Format: yyyy-mm-ddTHH:MM:SSZ)> <message> <isPublic(true/false)>"]



podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
deploymentLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true # not supported yet
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP # LoadBalancer, NodePort, ClusterIP
  port: 3080
  targetPort: 3080
  containerPort: 3080
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: librechat.runs.onstackit.cloud
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chat.example.com

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: 3080
readinessProbe:
  httpGet:
    path: /health
    port: 3080

# Additional init containers on the output Deployment definition.
initContainers: {}
#   foo: # the name of the init container
#     image: busybox
#     command: ['sh', '-c', 'echo The app is starting! && sleep 5']
#   # ... add more init containers as needed

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Host aliases for custom domain-to-IP mappings (adds entries to /etc/hosts)
hostAliases: []
# Example - Redirect AWS Bedrock to proxy:
# hostAliases:
#   - ip: "10.1.2.3"
#     hostnames:
#       - "bedrock-runtime.eu-central-1.amazonaws.com"

# DNS Configuration
# Customize DNS resolution for redirecting traffic to proxy servers
dnsPolicy: ""  # Options: ClusterFirst, Default, None, ClusterFirstWithHostNet
dnsConfig: {}
# Example configuration for custom DNS:
# dnsPolicy: "None"  # Use only custom DNS settings
# dnsConfig:
#   nameservers:
#     - "10.0.0.10"  # Your custom DNS server
#     - "8.8.8.8"    # Fallback DNS
#   searches:
#     - "svc.cluster.local"
#     - "cluster.local"
#   options:
#     - name: ndots
#       value: "2"
#     - name: timeout
#       value: "1"

# Strategy for LibreChat deployment updates
updateStrategy:
  type: RollingUpdate

# Extra ConfigMaps to be created alongside the main ones
additionalConfigMaps: {}
#   custom: # suffix of the ConfigMap name
#     labels: {}
#     annotations: {}
#     data: {}
#     binaryData: {}
#     immutable: false
#   # ... add more ConfigMaps as needed

# MongoDB Parameters
mongodb:
  enabled: true
  image:
    tag: "latest"
  auth:
    enabled: false
  databases:
   - LibreChat
#  persistence: 
#    size: 8Gi


meilisearch:
  enabled: true
  persistence:
    enabled: true
    storageClass: ""
  image: 
    tag: "v1.7.3"
  auth:
    # Use an existing Kubernetes secret for the MEILI_MASTER_KEY
    existingMasterKeySecret: "librechat-credentials-env"
